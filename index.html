<style>
:root{
  --bg:#f2f4f8;--card:#fff;--text:#17202e;--muted:#6b7686;--line:#e3e7ee;
  --primary:#0f2a4a;--accent:#1d6fe0;--call:#12a150;--danger:#d93a3a;--star:#f5a623;
  --chip:#e6ecf5;--shadow:0 2px 12px rgba(15,42,74,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c121b;--card:#161f2c;--text:#e8edf4;--muted:#93a0b3;--line:#243044;
    --primary:#0a1930;--accent:#5b9bff;--call:#2ec27e;--danger:#ff6b6b;--chip:#222f43;--shadow:0 2px 12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c121b;--card:#161f2c;--text:#e8edf4;--muted:#93a0b3;--line:#243044;
  --primary:#0a1930;--accent:#5b9bff;--call:#2ec27e;--danger:#ff6b6b;--chip:#222f43;--shadow:0 2px 12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
body{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.title h1{font-size:15px;white-space:nowrap;margin:0;font-weight:700}
.title small{opacity:.75;font-size:13px}
.iconbtn{background:rgba(255,255,255,.14);border:0;border-radius:10px;width:38px;height:38px;color:#fff;font-size:18px}
.search{position:relative}
.search input{width:100%;border:0;border-radius:12px;padding:11px 40px 11px 40px;font:inherit;background:#fff;color:#17202e;outline:none}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#6b7686;font-size:18px;width:32px;height:32px;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.14);color:#fff;font-size:14px}
.chip.on{background:#fff;color:var(--primary);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;color:var(--muted);font-size:13px}
.bar select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:4px 6px;font:inherit;font-size:13px}
.gh{position:sticky;top:var(--hh,118px);z-index:5;background:var(--bg);padding:8px 16px 4px;font-weight:700;font-size:14px;color:var(--accent);display:flex;justify-content:space-between}
.gh span{color:var(--muted);font-weight:400}
.item{display:flex;align-items:center;gap:12px;background:var(--card);margin:6px 12px;padding:10px 10px 10px 12px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.item:active{background:var(--chip)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.info{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm em{font-style:normal;color:var(--muted);font-weight:400}
.ps{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{font-size:13px;color:var(--accent)}
.star{color:var(--star)}
.vac{opacity:.6}
.callbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--call);color:#fff;font-size:19px;text-decoration:none;display:grid;place-items:center}
.callbtn.off{background:var(--chip);color:var(--muted);pointer-events:none}
mark{background:#ffe58a;color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;min-width:0;border:0;background:none;padding:9px 0 8px;font-size:11px;white-space:nowrap;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:var(--shadow);z-index:25}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sheet .av{width:60px;height:60px;font-size:20px}
.sheet h2{margin:0;font-size:19px}
.sheet .sub{color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.acts a,.acts button{border:0;background:var(--chip);border-radius:12px;padding:10px 4px;text-align:center;text-decoration:none;color:var(--text);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.acts b{font-size:20px;font-weight:400}
.acts .main{background:var(--call);color:#fff}
.acts .dis{opacity:.4;pointer-events:none}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rows span{color:var(--muted);flex:none}
.rows strong{text-align:right;font-weight:500}
.tel a{display:inline-block;color:var(--accent);text-decoration:none;font-weight:600}
form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
form input,form select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;background:var(--chip);font-weight:600}
.btn.pri{background:var(--accent);color:#fff}
.btn.dan{background:var(--danger);color:#fff}
.set h3{margin:18px 16px 6px;font-size:14px;color:var(--muted)}
.set .box{background:var(--card);margin:0 12px;border-radius:14px;overflow:hidden}
.set .box button,.set .box label.row{display:flex;width:100%;align-items:center;justify-content:space-between;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15px}
.set .box > :first-child{border-top:0}
.set .box small{color:var(--muted)}
#gate{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0f2a4a,#1d4f8f);overflow:auto}
#gate.show{display:flex}
.gcard{width:100%;max-width:380px;background:var(--card);color:var(--text);border-radius:22px;padding:28px 22px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
.gcard .logo{font-size:44px;line-height:1}
.gcard h1{font-size:19px;margin:10px 0 2px}
.gcard p{margin:0 0 16px;color:var(--muted);font-size:14px}
.gin{position:relative}
.gin input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:13px 46px 13px 14px;font:inherit;font-size:18px;letter-spacing:3px;text-align:center;outline:none}
.gin input:focus{border-color:var(--accent)}
.gin button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;width:36px;height:36px}
.grem{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 4px;font-size:14px;color:var(--muted)}
#gerr{color:var(--danger);font-size:14px;min-height:22px;margin-top:6px}
.gbtn{width:100%;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;margin-top:6px}
.gbtn:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.hide{display:none!important}
</style>
</head>

const KEY = 'phonebook_v1', PREF = 'phonebook_pref_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let store = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } })();
let contacts = Array.isArray(store) ? store : JSON.parse(JSON.stringify(ORIGINAL));
if (!contacts.some(c => c.grp === 'sep')) contacts = contacts.concat(ORIGINAL.filter(c => c.grp === 'sep').map(c => ({ ...c })));
let pref = (() => { try { return JSON.parse(localStorage.getItem(PREF)) || {}; } catch { return {}; } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(contacts)); } catch { toast('บันทึกไม่ได้ (พื้นที่เก็บข้อมูลเต็ม/ถูกปิด)'); } };
const savePref = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch {} };

let tab = 'all', unit = 'ทั้งหมด', query = '', sort = pref.sort || 'rank';
if (pref.theme) document.documentElement.dataset.theme = pref.theme;

/* ---------- helpers ---------- */
const RANKS = ['พล.อ.อ.', 'พล.อ.ท.', 'พล.อ.ต.', 'น.อ.(พ)', 'น.อ.', 'น.ท.', 'น.ต.', 'ร.อ.', 'ร.ท.', 'ร.ต.'];
const rankIdx = r => { const i = RANKS.indexOf(r); return i < 0 ? 99 : i; };
const unitNum = u => parseInt((u.match(/\d+/) || [9999])[0], 10);
const COLORS = ['#1d6fe0', '#0f8f6b', '#c2410c', '#7c3aed', '#be185d', '#0e7490', '#a16207', '#4d7c0f', '#b91c1c', '#475569'];
const colorOf = u => COLORS[unitNum(u) % COLORS.length];
const digits = t => String(t || '').replace(/[^\d+]/g, '');
const phones = t => String(t || '').split(/[\/,;]| หรือ /).map(s => s.trim()).filter(s => digits(s).length >= 6);
const norm = s => String(s || '').toLowerCase().replace(/[\s\-.()]/g, '');
const fullName = c => c.name || '(ว่าง)';
const initials = c => c.name ? (c.nick ? c.nick.split(/[\/ ]/)[0] : c.name.split(' ')[0]).slice(0, 2) : '—';
const isSep = c => c.grp === 'sep';
const inTab = c => tab === 'sep' ? isSep(c) : tab === 'std' ? isStd(c) && !isSep(c) : tab === 'all' ? !isSep(c) : true;
const units = (all) => [...new Set(contacts.filter(c => all || inTab(c)).map(c => c.unit).filter(Boolean))].sort((a, b) => unitNum(a) - unitNum(b) || a.localeCompare(b, 'th'));
const isStd = c => (c.pos || '').includes('นายทหารมาตรฐานการบิน');
const uid = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function hl(text, q) {
  const s = esc(text); if (!q) return s;
  try { return s.replace(new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); } catch { return s; }
}
function matches(c, q) {
  if (!q) return true;
  const hay = norm([c.rank, c.name, c.pos, c.unit, c.nick, c.tel, 'ตท' + c.cls, c.cls].join(' '));
  return q.split(/\s+/).filter(Boolean).every(w => hay.includes(norm(w)));
}

/* ---------- main list ---------- */
function renderChips() {
  const list = ['ทั้งหมด', ...units()];
  $('#chips').innerHTML = list.map(u => `<button class="chip ${u === unit ? 'on' : ''}" data-u="${esc(u)}">${esc(u)}</button>`).join('');
  const box = $('#chips'), on = box.querySelector('.on'); if (on) box.scrollLeft = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2 - box.offsetLeft;
}
function itemHTML(c, q, showUnit) {
  const ps = phones(c.tel)[0];
  return `<div class="item ${c.name ? '' : 'vac'}" data-id="${c.id}">
    <div class="av" style="background:${colorOf(c.unit)}">${esc(initials(c))}</div>
    <div class="info">

function vcf(c) {
  const parts = (c.name || '').split(' '), last = parts.slice(1).join(' '), f = [parts[0]];
  const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${last};${f[0] || ''};;${c.rank || ''};`, `FN:${(c.rank ? c.rank + ' ' : '') + (c.name || c.pos)}`];
  if (c.nick) lines.push(`NICKNAME:${c.nick}`);
  lines.push(`ORG:${c.unit || ''}`, `TITLE:${c.pos || ''}`);
  phones(c.tel).forEach(p => lines.push(`TEL;TYPE=CELL:${digits(p)}`));
  if (c.cls) lines.push(`NOTE:ตท.${c.cls}`);
  lines.push('END:VCARD');
  return lines.join('\r\n');
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const csvCell = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '');
function toCSV() {
  const rows = [['ยศ', 'ชื่อ-นามสกุล', 'ตำแหน่ง', 'สังกัด', 'รุ่น ตท.', 'ชื่อเล่น', 'เบอร์โทร', 'กลุ่ม']]
    .concat(contacts.map(c => [c.rank, c.name, c.pos, c.unit, c.cls, c.nick, c.tel, isSep(c) ? 'หน่วยแยก' : '']));
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false; t = t.replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(f); f = ''; }
    else if (ch === '\n') { r.push(f); rows.push(r); r = []; f = ''; }
    else if (ch !== '\r') f += ch;
  }
  if (f || r.length) { r.push(f); rows.push(r); }
  return rows;
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      let list;
      if (/\.json$/i.test(file.name)) {
        const j = JSON.parse(rd.result); list = Array.isArray(j) ? j : j.contacts;
        if (!Array.isArray(list)) throw 0;
      } else {
        const cl = s => (s || '').replace(/\s+/g, ' ').trim();
        list = parseCSV(rd.result).slice(1).filter(r => r.length > 1 && r.some(x => x.trim()))
          .map(r => ({ rank: cl(r[0]), name: cl(r[1]), pos: cl(r[2]), unit: cl(r[3]), cls: cl(r[4]) === '-' ? '' : cl(r[4]), nick: cl(r[5]), tel: cl(r[6]), ...(cl(r[7]) === 'หน่วยแยก' ? { grp: 'sep' } : {}) }));
      }
      if (!list.length) throw 0;
      if (!confirm(`พบ ${list.length} รายการ\n\nกด "ตกลง" = แทนที่ข้อมูลเดิมทั้งหมด\nกด "ยกเลิก" = ไม่นำเข้า`)) return;
      contacts = list.map((c, i) => ({ fav: false, ...c, order: Number.isFinite(c.order) ? c.order : i, id: CLOUD && c.id ? String(c.id) : uid() }));
      if (CLOUD) cloudReplaceAll(contacts).then(() => toast('อัปโหลดขึ้น Cloud แล้ว')).catch(cloudErr); else save();
      unit = 'ทั้งหมด'; renderChips(); render(); toast(`นำเข้า ${list.length} รายการแล้ว`);
    } catch { toast('ไฟล์ไม่ถูกต้อง'); }
  };
  rd.readAsText(file, 'utf-8');
}

    if (hashPin('phonebook-admin|' + $('#pin').value.trim()) === ADMIN_HASH) {
      isAdmin = true; fails = 0; try { sessionStorage.setItem('pb_admin', '1'); } catch {}
      closeSheet(); updateAdminUI(); render(); toast('เข้าสู่ระบบ Admin แล้ว');
      const f = afterLogin; afterLogin = null; if (f) setTimeout(f, 150);
    } else {
      fails++; $('#pin').value = '';
      if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; $('#lerr').textContent = 'ใส่รหัสผิด 5 ครั้ง ล็อก 30 วินาที'; }
      else $('#lerr').textContent = 'รหัสไม่ถูกต้อง';
    }
  };
}
function showCloudLogin() {
  const needAdminMsg = afterLogin ? 'ใส่รหัส Admin เพื่อแก้ไขข้อมูล' : 'ใส่รหัสเข้าใช้งาน (รหัสผู้ใช้ หรือ รหัส Admin)';
  openSheet(`<h2 style="margin:0 0 4px">🔒 เข้าสู่ระบบ</h2>
    <div class="sub">${needAdminMsg}</div>
    <form id="lf" autocomplete="off"><label>รหัส</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="กรอกรหัส" style="font-size:20px;letter-spacing:6px;text-align:center">
      <div id="lerr" style="color:var(--danger);font-size:14px;min-height:20px;margin-top:6px"></div>
      <div class="btnrow"><button type="button" class="btn" data-act="close">ยกเลิก</button><button type="submit" class="btn pri" id="lbtn">เข้าสู่ระบบ</button></div></form>`);
  setTimeout(() => $('#pin') && $('#pin').focus(), 50);
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const code = $('#pin').value.trim();
    if (!code) return;
    if (!fb) { $('#lerr').textContent = 'ยังเชื่อมต่อ Cloud ไม่ได้ ลองใหม่อีกครั้ง'; return; }
    $('#lbtn').disabled = true; $('#lerr').textContent = '';
    const { Au, auth } = fb, pw = PW_PREFIX + code;
    try {
      let ok = false, lastErr = null;
      // ถ้าเข้าสู่ระบบเป็นผู้ใช้แล้วและกำลังขอสิทธิ์ Admin ให้ลอง Admin อย่างเดียว
      for (const em of (afterLogin ? [ADMIN_EMAIL] : [ADMIN_EMAIL, MEMBER_EMAIL])) {
        try { await Au.signInWithEmailAndPassword(auth, em, pw); ok = true; break; } catch (err) { lastErr = err; if (err.code === 'auth/too-many-requests' || err.code === 'auth/network-request-failed') break; }
      }
      if (!ok) throw lastErr;
      closeSheet(); toast('เข้าสู่ระบบแล้ว');
    } catch (err) {
      const m = { 'auth/too-many-requests': 'ใส่รหัสผิดหลายครั้ง กรุณารอสักครู่', 'auth/network-request-failed': 'ไม่มีอินเทอร์เน็ต' };
      $('#lerr').textContent = m[err && err.code] || 'รหัสไม่ถูกต้อง'; $('#lbtn').disabled = false; $('#pin').value = '';
    }
  };
}
function adminLogout() {
  if (CLOUD) {
    if (cloudUser && confirm('ออกจากระบบ? (ต้องใส่รหัสใหม่เพื่อเข้าใช้งาน)')) fb.Au.signOut(fb.auth).then(() => toast('ออกจากระบบแล้ว'));

  }

/* ---------- หน้า Login ก่อนเข้าสมุดโทรศัพท์ ---------- */
// รหัสเข้าใช้งาน (ผู้ใช้): RTAF.70 — โหมดในเครื่องตรวจด้วยแฮช, โหมด Cloud ใช้เป็นรหัสผ่านของบัญชี member
const MEMBER_HASH = 4168970925607801;
let unlocked = false;
if (!CLOUD) { try { unlocked = localStorage.getItem('pb_unlock') === '1' || sessionStorage.getItem('pb_unlock') === '1'; } catch {} }
function showGate() {
  const g = $('#gate'); if (!g) return;
  g.classList.add('show');
  $('#gerr').textContent = CLOUD && !fb ? 'กำลังเชื่อมต่อ…' : '';
  setTimeout(() => $('#gcode') && $('#gcode').focus(), 80);
}
function hideGate() { const g = $('#gate'); if (g) g.classList.remove('show'); const c = $('#gcode'); if (c) c.value = ''; }
async function gateSubmit(e) {
  e.preventDefault();
  const code = $('#gcode').value.trim().toUpperCase(), err = $('#gerr'), btn = $('#gbtn'), remember = $('#grem').checked;
  if (!code) return;
  err.textContent = ''; btn.disabled = true;
  try {
    if (CLOUD) {
      if (!fb) { err.textContent = 'ยังเชื่อมต่อ Cloud ไม่ได้ ลองใหม่อีกครั้ง'; return; }
      try { await fb.Au.setPersistence(fb.auth, remember ? fb.Au.browserLocalPersistence : fb.Au.browserSessionPersistence); } catch {}
      let ok = false, last = null;
      for (const em of [MEMBER_EMAIL, ADMIN_EMAIL]) {
        try { await fb.Au.signInWithEmailAndPassword(fb.auth, em, PW_PREFIX + code); ok = true; break; }
        catch (x) { last = x; if (x.code === 'auth/too-many-requests' || x.code === 'auth/network-request-failed') break; }
      }
      if (!ok) throw last;   // สำเร็จ: onAuth จะซ่อนหน้า login เอง
    } else {
      const wait = Math.ceil((lockUntil - Date.now()) / 1000);
      if (wait > 0) { err.textContent = 'ใส่รหัสผิดหลายครั้ง กรุณารอ ' + wait + ' วินาที'; return; }
      const asAdmin = hashPin('phonebook-admin|' + code) === ADMIN_HASH;
      if (hashPin('phonebook-member|' + code) === MEMBER_HASH || asAdmin) {
        fails = 0; unlocked = true;
        try { (remember ? localStorage : sessionStorage).setItem('pb_unlock', '1'); } catch {}
        if (asAdmin) { isAdmin = true; try { sessionStorage.setItem('pb_admin', '1'); } catch {} }
        hideGate(); updateAdminUI(); render();
      } else {
        fails++; $('#gcode').value = '';
        if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; err.textContent = 'ใส่รหัสผิด 5 ครั้ง ล็อก 30 วินาที'; }
        else err.textContent = 'รหัสไม่ถูกต้อง';
      }
    }
  } catch (x) {
    const m = { 'auth/too-many-requests': 'ใส่รหัสผิดหลายครั้ง กรุณารอสักครู่', 'auth/network-request-failed': 'ไม่มีอินเทอร์เน็ต' };
    err.textContent = m[x && x.code] || 'รหัสไม่ถูกต้อง'; $('#gcode').value = '';
  } finally { btn.disabled = false; }
}
// ออกจากระบบทั้งหมด (กลับไปหน้า login)
function fullLogout() {
  if (!confirm('ออกจากระบบ? (ต้องใส่รหัสใหม่เพื่อเข้าใช้งาน)')) return;
  if (CLOUD) { fb.Au.signOut(fb.auth); return; }
  unlocked = false; isAdmin = false;
  try { localStorage.removeItem('pb_unlock'); sessionStorage.removeItem('pb_unlock'); sessionStorage.removeItem('pb_admin'); } catch {}
  updateAdminUI(); render(); showGate();
}
$('#gateForm').onsubmit = gateSubmit;
$('#geye').onclick = () => { const i = $('#gcode'); i.type = i.type === 'password' ? 'text' : 'password'; };

/* ---------- share ---------- */
const APP_TITLE = 'สมุดโทรศัพท์ ผบช.กองบิน';
const today = () => new Date().toISOString().slice(0, 10);
function shareList(scope, onlyTel) {
  return contacts.filter(c => (scope === 'sep' ? isSep(c) : scope === 'std' ? isStd(c) && !isSep(c) : true) && (scope !== 'fav' || c.fav) && (c.name || c.tel) && (!onlyTel || phones(c.tel).length));
}
function shareText(scope, onlyTel) {
  const list = shareList(scope, onlyTel), label = { all: 'ทั้งหมด', std: 'นายทหารมาตรฐานการบิน', sep: 'นบ.ฮ.หน่วยแยก', fav: 'รายการโปรด' }[scope];
  const groups = new Map();
  list.forEach(c => { const k = c.unit || 'อื่น ๆ'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
  const out = [`📞 ${APP_TITLE} (${label} · ${list.length} รายชื่อ)`];
  [...groups.keys()].sort((a, b) => unitNum(a) - unitNum(b)).forEach(k => {
    out.push('', `【${k}】`);
    groups.get(k).forEach(c => {
      out.push(`${c.rank ? c.rank + ' ' : ''}${c.name || '(ว่าง)'}${c.nick ? ' (' + c.nick + ')' : ''} · ${c.pos}${c.cls ? ' ตท.' + c.cls : ''}`);
      out.push(c.tel ? `  ☎ ${c.tel}` : '  ☎ -');
    });
  });
  return out.join('\n');
}
// สร้างไฟล์ .html ของแอปนี้ โดยแทนที่ข้อมูลเริ่มต้นด้วยรายชื่อที่เลือก
function appHtml(data) {
  const start = SRC_HTML.indexOf('const ORIGINAL = '), end = SRC_HTML.indexOf(';\nconst KEY', start);
  if (start < 0 || end < 0) return null;
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  return (SRC_HTML.slice(0, start) + 'const ORIGINAL = ' + json + SRC_HTML.slice(end)).replace('const CLOUD = true;', 'const CLOUD = false;');
}
async function shareFile(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: APP_TITLE }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  download(file.name, await file.text(), file.type);
  toast('เครื่องนี้แชร์ไฟล์ตรงไม่ได้ จึงดาวน์โหลดแทน นำไฟล์ไปส่งใน LINE ได้เลย');
}
function showShare() {
  openSheet(`<h2 style="margin:0 0 4px">📤 แชร์สมุดโทรศัพท์</h2>
    <div class="sub" style="margin-bottom:8px">เลือกวิธีส่ง แล้วเลือก LINE ในหน้าต่างแชร์ของมือถือ</div>
    <form onsubmit="return false">
      <label>ข้อมูลที่จะแชร์</label>
      <select id="shScope"><option value="all">ทั้งหมด (${contacts.length} รายชื่อ)</option><option value="std" ${tab === 'std' ? 'selected' : ''}>เฉพาะนายทหารมาตรฐานการบิน</option><option value="sep" ${tab === 'sep' ? 'selected' : ''}>เฉพาะ นบ.ฮ.หน่วยแยก</option><option value="fav" ${tab === 'fav' ? 'selected' : ''}>เฉพาะรายการโปรด</option></select>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);margin-top:12px"><input id="shTel" type="checkbox" checked style="width:auto"> เฉพาะคนที่มีเบอร์โทร (ข้อความ)</label>
    </form>
    <div class="btnrow" style="flex-direction:column">
      <button class="btn pri" data-act="shFile">📱 แชร์เป็นไฟล์สมุดโทรศัพท์ (เปิดใช้งานได้ทันที)</button>
      <button class="btn" data-act="shText">💬 แชร์เป็นข้อความ (ชื่อ + เบอร์)</button>
      <button class="btn" data-act="shCsv">📄 แชร์เป็นไฟล์ CSV</button>
      <button class="btn" data-act="shCopy">📋 คัดลอกข้อความ</button>
      <button class="btn" data-act="close">ปิด</button>
    </div>
    <div class="sub" style="margin-top:12px;font-size:12px">ไฟล์สมุดโทรศัพท์ = ไฟล์ .html ที่รวมข้อมูลไว้ในตัว ผู้รับกดเปิดในมือถือได้เลย (ไม่ต้องมีเน็ต) ⚠️ มีเบอร์ส่วนตัว โปรดส่งเฉพาะกลุ่มที่เกี่ยวข้อง</div>`);
}
async function doShare(act) {
  const scope = $('#shScope').value, onlyTel = $('#shTel').checked;
  if (act === 'shFile') {
    const ids = new Set(shareList(scope, false).map(c => c.id));
    const h = appHtml(contacts.filter(c => scope === 'all' || ids.has(c.id)));
    if (!h) return toast('สร้างไฟล์ไม่ได้');
    return shareFile(new File([h], `phonebook-${today()}.html`, { type: 'text/html' }));
  }
  if (act === 'shCsv') {
    const rows = [['ยศ', 'ชื่อ-นามสกุล', 'ตำแหน่ง', 'สังกัด', 'รุ่น ตท.', 'ชื่อเล่น', 'เบอร์โทร', 'กลุ่ม']]
      .concat(shareList(scope, false).map(c => [c.rank, c.name, c.pos, c.unit, c.cls, c.nick, c.tel, isSep(c) ? 'หน่วยแยก' : '']));
    return shareFile(new File(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], `phonebook-${today()}.csv`, { type: 'text/csv' }));
  }
  const text = shareText(scope, onlyTel);
  if (act === 'shText' && navigator.share) { try { await navigator.share({ title: APP_TITLE, text }); } catch {} return; }
  try { await navigator.clipboard.writeText(text); toast(act === 'shCopy' ? 'คัดลอกแล้ว นำไปวางใน LINE ได้เลย' : 'เครื่องนี้ไม่มีหน้าต่างแชร์ จึงคัดลอกข้อความให้แล้ว'); } catch { toast('คัดลอกไม่ได้'); }
}

/* ---------- settings ---------- */
function renderSettings() {
  $('#view').innerHTML = `<div class="set">
    ${accountBox()}
    <h3>ข้อมูล</h3><div class="box">
      <button data-act="shareSet">📤 แชร์สมุดโทรศัพท์ทั้งชุด (LINE ฯลฯ) <small>›</small></button>
      <button data-act="exportCsv">📄 ส่งออกเป็น CSV (เปิดใน Excel ได้) <small>›</small></button>

      <button data-act="import">📥 ${CLOUD ? 'นำเข้า/อัปโหลดขึ้น Cloud (Admin) — แทนที่ข้อมูลทั้งหมด' : 'นำเข้าจาก CSV / JSON'} <small>›</small></button>
      ${CLOUD ? '' : '<button data-act="reset" style="color:var(--danger)">♻️ คืนค่าข้อมูลเดิมจากไฟล์ต้นฉบับ <small>›</small></button>'}
    </div>
    <h3>การแสดงผล</h3><div class="box">
      <button data-act="theme">🌓 โหมดสี: <small>${pref.theme === 'dark' ? 'มืด' : pref.theme === 'light' ? 'สว่าง' : 'ตามระบบ'}</small></button>
    </div>
    <h3>เกี่ยวกับ</h3><div class="box"><div style="padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.6">
      สมุดโทรศัพท์ ผบช.กองบิน — ${contacts.length} รายชื่อ<br>
      ข้อมูลเก็บในเครื่องนี้เท่านั้น ไม่ส่งออกอินเทอร์เน็ต ใช้งานออฟไลน์ได้<br>
      เพิ่มลงหน้าจอหลัก: เมนูเบราว์เซอร์ → "เพิ่มไปยังหน้าจอหลัก"<br>
      <b>ข้อมูลนี้เป็นข้อมูลบุคคล โปรดอย่าเผยแพร่ภายนอก</b></div></div>
  </div>`;
  $('#sub').textContent = 'ตั้งค่า';
}

/* ---------- actions ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('[data-call]')) { e.stopPropagation(); return; }
  const item = t.closest('.item'); if (item) return showDetail(item.dataset.id);
  const chip = t.closest('.chip'); if (chip) { unit = chip.dataset.u; renderChips(); render(); window.scrollTo(0, 0); return; }
  const nb = t.closest('nav button'); if (nb) { tab = nb.dataset.tab; unit = 'ทั้งหมด'; renderChips(); document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === nb)); render(); window.scrollTo(0, 0); return; }
  if (t === $('#sheetBg')) return closeSheet();
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, c = contacts.find(x => x.id === a.dataset.id);
  switch (act) {
    case 'close': closeSheet(); break;
    case 'login': showLogin(); break;
    case 'logout': fullLogout(); break;
    case 'shareSet': showShare(); break;
    case 'shFile': case 'shText': case 'shCsv': case 'shCopy': doShare(act); break;
    case 'fav': c.fav = !c.fav; if (CLOUD) saveFavs(); else save(); showDetail(c.id); render(); break;
    case 'edit': needAdmin(() => showForm(c.id)); break;
    case 'del': if (!isAdmin) return needAdmin(() => {}); if (confirm(`ลบ "${fullName(c)}" ใช่หรือไม่?`)) { contacts = contacts.filter(x => x !== c); if (CLOUD) cloudDelete(c.id); else save(); closeSheet(); renderChips(); render(); toast('ลบแล้ว'); } break;
    case 'copy': try { await navigator.clipboard.writeText(phones(c.tel)[0]); toast('คัดลอกเบอร์แล้ว'); } catch { toast('คัดลอกไม่ได้'); } break;
    case 'share': {
      const text = `${c.rank ? c.rank + ' ' : ''}${c.name}\n${c.pos}\n${c.tel}`;
      if (navigator.share) navigator.share({ title: c.name, text }).catch(() => {});
      else try { await navigator.clipboard.writeText(text); toast('คัดลอกข้อมูลแล้ว'); } catch { toast('แชร์ไม่ได้'); }
      break; }
    case 'vcard': download(`${c.name || c.pos}.vcf`, vcf(c), 'text/vcard'); break;
    case 'exportCsv': download('สมุดโทรศัพท์.csv', toCSV(), 'text/csv'); break;
    case 'exportJson': download('phonebook-backup.json', JSON.stringify(contacts), 'application/json'); break;
    case 'exportVcf': download('phonebook.vcf', contacts.filter(x => phones(x.tel).length).map(vcf).join('\r\n'), 'text/vcard'); break;
    case 'import': needAdmin(() => $('#file').click()); break;
    case 'reset': if (!isAdmin) return needAdmin(() => {}); if (confirm('คืนค่าเป็นข้อมูลต้นฉบับ?\nการแก้ไข/เพิ่ม/ดาวโปรดทั้งหมดจะหายไป')) { contacts = JSON.parse(JSON.stringify(ORIGINAL)); save(); unit = 'ทั้งหมด'; renderChips(); toast('คืนค่าแล้ว'); renderSettings(); } break;
    case 'theme': pref.theme = pref.theme === 'dark' ? 'light' : pref.theme === 'light' ? '' : 'dark'; savePref(); applyTheme(); renderSettings(); break;
  }
});
function applyTheme() { if (pref.theme) document.documentElement.dataset.theme = pref.theme; else delete document.documentElement.dataset.theme; }
$('#themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme === 'dark' || (!pref.theme && matchMedia('(prefers-color-scheme:dark)').matches); pref.theme = dark ? 'light' : 'dark'; savePref(); applyTheme(); };
$('#file').onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
$('#fab').onclick = () => needAdmin(() => showForm());
$('#adminBtn').onclick = () => isAdmin ? adminLogout() : showLogin();
$('#shareBtn').onclick = showShare;
$('#q').addEventListener('input', e => { query = e.target.value; $('#qx').style.display = query ? 'block' : 'none'; if (tab === 'set') { tab = 'all'; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'all')); } render(); });
$('#qx').onclick = () => { $('#q').value = ''; query = ''; $('#qx').style.display = 'none'; render(); $('#q').focus(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
addEventListener('resize', fixHeader);

function render() {
  const set = tab === 'set';
  $('#chips').classList.toggle('hide', set); $('.search').classList.toggle('hide', set); updateAdminUI();
  set ? renderSettings() : renderList();
  fixHeader();
}
renderChips(); render(); updateAdminUI();
if (CLOUD || !(unlocked || isAdmin)) showGate();
if (CLOUD) initCloud();
</script>
